[package]
name = "agent-core"
version = "0.1.0"
edition = "2024"

[dependencies]
genai = "0.6.5"
async-stream = "0.3"
chrono = { version = "0.4.45", features = ["serde"] }
dotenv = "0.15"
futures-util = "0.3.34"
schemars = "1.2"
serde = { version = "1.0.229", features = ["derive"]}
serde_json = "1.0.151"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
uuid = { version = "1.26.0", features = ["v4"]}
